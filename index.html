<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Durga Prasad — Full Stack Developer & Machine Learning Enthusiast. Building scalable web applications, ML solutions, and smart digital systems." />
  <meta name="keywords" content="Durga Prasad, Full Stack Developer, Machine Learning, Portfolio, Web Developer" />
  <meta name="author" content="Durga Prasad" />
  <title>Durga Prasad</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Devicons for technology logos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- Lenis Smooth Scroll Stylesheet -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.20/dist/lenis.css" />
  <link rel="icon" href="https://img.magnific.com/premium-vector/dp-monogram-logo-design_695270-430.jpg">
</head>

<body>

  <!-- Scroll Progress Bar -->
  <div class="scroll-progress" id="scrollProgress"></div>

  <!-- Cursor Glow (desktop) -->
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- Navigation Overlay for mobile -->
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- ============================
       NAVBAR
       ============================ -->
  <nav class="navbar" id="navbar">
    <a href="#home" class="nav-logo" id="navLogo">
      <!-- Populated by JS -->
    </a>

    <div class="nav-hamburger" id="navHamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <ul class="nav-links" id="navLinks">
      <!-- Populated by JS -->
    </ul>
  </nav>

  <!-- ============================
       HOME / HERO SECTION
       ============================ -->
  <section id="home">
    <div class="hero-bg-text" id="heroBgText"></div>

    <div class="hero-content">
      <!-- Centered top: Image -->
      <div class="hero-right">
        <div class="hero-image-wrapper" id="heroImageWrapper">
          <img class="hero-image" id="heroImage" alt="Durga Prasad — Developer" />
        </div>
      </div>

      <!-- Centered: Greeting, Name, Role -->
      <div class="hero-center" id="heroLeft">
        <p class="hero-greeting" id="heroGreeting"></p>
        <h1 class="hero-name" id="heroName"></h1>
        <p class="hero-role" id="heroRole"></p>
      </div>

      <!-- Single horizontal bottom bar -->
      <div class="hero-bottom">
        <p class="hero-description" id="heroDesc"></p>
        <div class="hero-stats" id="heroStats"></div>
        <div class="hero-actions">
          <div class="hero-buttons" id="heroButtons"></div>
          <div class="hero-socials" id="heroSocials"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Transition divider: white → black -->
  <div class="section-divider-down"></div>

  <!-- ============================
       ABOUT SECTION
       ============================ -->
  <section id="about">
    <div class="container">
      <div class="about-grid">
        <div class="about-left reveal">
          <p class="section-label" id="aboutLabel"></p>
          <h2 class="section-title" id="aboutTitle"></h2>
          <p class="section-desc" id="aboutDesc"></p>

          <div class="about-highlights" id="aboutHighlights"></div>
          <div class="about-education" id="aboutEducation"></div>
        </div>

        <div class="about-right">
          <div class="timeline-container" id="timelineContainer">
            <div class="timeline-line"></div>
            <div class="timeline-progress" id="timelineProgress"></div>
            <!-- Timeline items populated by JS -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Transition divider: black → white -->
  <div class="section-divider-up"></div>

  <!-- ============================
       SKILLS SECTION
       ============================ -->
  <section id="skills">
    <div class="container">
      <div class="skills-header reveal">
        <p class="section-label" id="skillsLabel"></p>
        <h2 class="section-title" id="skillsTitle"></h2>
      </div>

      <div class="skills-grid" id="skillsGrid">
        <!-- Skill cards populated by JS -->
      </div>
    </div>
  </section>

  <!-- Transition divider: white → black -->
  <div class="section-divider-down"></div>

  <!-- ============================
       PROJECTS SECTION
       ============================ -->
  <section id="projects">
    <div class="container">
      <div class="projects-header reveal">
        <p class="section-label" id="projectsLabel"></p>
        <h2 class="section-title" id="projectsTitle"></h2>
        <p class="section-desc" id="projectsDesc"></p>
      </div>

      <div class="projects-grid" id="projectsGrid">
        <!-- Project cards populated by JS -->
      </div>
    </div>
  </section>

  <!-- Transition divider: black → white -->
  <div class="section-divider-up"></div>

  <!-- ============================
       CONTACT SECTION
       ============================ -->
  <section id="contact">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-left reveal">
          <p class="section-label" id="contactLabel"></p>
          <h2 class="section-title" id="contactTitle"></h2>
          <p class="section-desc" id="contactDesc"></p>

          <div id="contactInfo"></div>

          <div class="contact-socials" id="contactSocials"></div>
        </div>

        <div class="contact-right reveal">
          <form class="contact-form" id="contactForm">
            <input type="hidden" name="access_key" value="5cd7879f-7b74-424a-bbdd-62e401abfd23" />
            <!-- Form fields populated by JS -->
          </form>
          <div class="form-success" id="formSuccess">
            <i class="fa-solid fa-circle-check"></i>
            <h3>Message Sent!</h3>
            <p>Thank you for reaching out. I'll get back to you soon.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================
       FOOTER
       ============================ -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col">
          <div class="footer-brand" id="footerBrand"></div>
          <p class="footer-desc" id="footerDesc"></p>
          <div class="footer-socials" id="footerSocials"></div>
        </div>

        <div class="footer-col">
          <h4 class="footer-heading" id="footerNavTitle"></h4>
          <nav class="footer-nav" id="footerNav"></nav>
        </div>

        <div class="footer-col">
          <h4 class="footer-heading" id="footerContactTitle"></h4>
          <div id="footerContactInfo"></div>
        </div>
      </div>

      <div class="footer-bottom">
        <p id="footerCopyright"></p>
      </div>
    </div>
  </footer>

  <!-- Lenis Smooth Scroll Library -->
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
  <!-- Main Script -->
  <script src="js/script.js"></script>
</body>

</html>
